# Review candidate only. No deployment or environment credentials.
name: Pages Preview Artifact Diagnostic

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-preview-artifact-diagnostic
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.repository == 'nice-roy/loveca-card-list' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'nice-roy' &&
      github.triggering_actor == 'nice-roy' &&
      vars.PAGES_PREVIEW_ENABLED == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VITE_SYNC_API_URL: ''
      npm_config_cache: /tmp/loveca-artifact-diagnostic-npm
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nice-roy/loveca-card-list
          ref: 2fa88c15ab0ec79cd5ac6e3c8f15c01a9f445b05
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm fixed PR snapshot
        run: test "$(git rev-parse HEAD)" = '2fa88c15ab0ec79cd5ac6e3c8f15c01a9f445b05'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npx playwright test
      - name: Package the tested dist without changing file types
        run: |
          test -d dist && test ! -L dist
          tar --format=ustar -C dist -cf "$RUNNER_TEMP/dist.tar" .
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dist.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  inspect:
    needs: build
    if: >-
      needs.build.result == 'success' &&
      github.repository == 'nice-roy/loveca-card-list' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'nice-roy' &&
      github.triggering_actor == 'nice-roy' &&
      vars.PAGES_PREVIEW_ENABLED == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fetch hash-pinned trusted inspection code (no checkout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pages-control'
          root.mkdir(mode=0o700)
          hashes = {
              'guard.py': '0f2d805927b28bf5c3981741886c654e95a9cb05f5ab30e6b8208a5de0534590',
              'artifact.py': 'a6d2c39b549f055045d6c275ebbd271caac129335f6884bf9f3ba0faf2be0be7',
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for name, digest in hashes.items():
              url = ('https://api.github.com/repos/nice-roy/loveca-card-list/contents/'
                     '.github/pages-preview/' + name +
                     '?ref=248161e18ac38d9e2b4e42924f3855afe29b017c')
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10',
              })
              with opener.open(req, timeout=30) as response:
                  assert response.status == 200
                  raw = response.read(1048577)
              assert len(raw) <= 1048576
              obj = json.loads(raw)
              assert obj['type'] == 'file' and obj['encoding'] == 'base64'
              data = base64.b64decode(obj['content'])
              assert hashlib.sha256(data).hexdigest() == digest
              (root / name).write_bytes(data)
          PY
      - name: Exercise rejection rules with synthetic data (no network)
        run: |
          cd "$RUNNER_TEMP/pages-control"
          python3 - <<'PY'
          import copy, hashlib, io, stat, tarfile, zipfile
          import artifact as a
          count = 0
          def reject(fn, *args):
              global count
              try:
                  fn(*args)
              except RuntimeError:
                  count += 1
              else:
                  raise AssertionError('Unsafe fixture was accepted')
          def tar(entries):
              out = io.BytesIO()
              with tarfile.open(fileobj=out, mode='w', format=tarfile.USTAR_FORMAT) as t:
                  for name, kind, mode in entries:
                      e = tarfile.TarInfo(name)
                      e.type, e.mode = kind, mode
                      e.size = 1 if kind == tarfile.REGTYPE else 0
                      e.linkname = 'index.html' if kind in (tarfile.SYMTYPE, tarfile.LNKTYPE) else ''
                      t.addfile(e, io.BytesIO(b'x') if e.size else None)
              return out.getvalue()
          good = [('index.html', tarfile.REGTYPE, 0o644)]
          payload = tar(good)
          assert a.inspect_tar(payload) == [('index.html', b'x')]
          for name in sorted(a.BANNED | {'.hidden', '../x.js', '/x.js', 'a/../x.js',
                                         'a/.x.js', 'a\\x.js', 'a//x.js', 'bad.exe'}):
              reject(a.inspect_tar, tar(good + [(name, tarfile.REGTYPE, 0o644)]))
          for kind in (tarfile.SYMTYPE, tarfile.LNKTYPE, tarfile.FIFOTYPE,
                       tarfile.CHRTYPE, tarfile.BLKTYPE):
              reject(a.inspect_tar, tar(good + [('x.js', kind, 0o644)]))
          for extra in [[('x.js', tarfile.REGTYPE, 0o755)], good,
                        [('INDEX.HTML', tarfile.REGTYPE, 0o644)],
                        [('index.html/x.js', tarfile.REGTYPE, 0o644)]]:
              reject(a.inspect_tar, tar(good + extra))
          reject(a.inspect_tar, tar([('x.js', tarfile.REGTYPE, 0o644)]))
          reject(a.inspect_tar, b'\0' * (a.MAX_ARCHIVE + 1))
          out = io.BytesIO()
          with tarfile.open(fileobj=out, mode='w', format=tarfile.USTAR_FORMAT) as t:
              e = tarfile.TarInfo('big.js')
              e.size = a.MAX_FILE + 1
              t.addfile(e, io.BytesIO(b'x' * e.size))
          reject(a.inspect_tar, out.getvalue())
          meta = {'id': 1, 'workflow_run': {'id': 2}, 'name': 'pages-dist-2-1',
                  'expired': False, 'size_in_bytes': 100, 'digest': 'sha256:' + '0' * 64}
          a.validate_metadata(meta, 2, 1, 'pages-dist-2-1')
          for key, value in [('id', 3), ('workflow_run', {'id': 3}),
                             ('name', 'pages-dist-2-2'), ('expired', True),
                             ('size_in_bytes', 0), ('size_in_bytes', a.MAX_ARCHIVE + 1),
                             ('digest', '')]:
              bad = copy.deepcopy(meta)
              bad[key] = value
              reject(a.validate_metadata, bad, 2, 1, 'pages-dist-2-1')
          def zipdata(name='dist.tar', mode=stat.S_IFREG | 0o644, extra=False):
              out = io.BytesIO()
              with zipfile.ZipFile(out, 'w') as z:
                  e = zipfile.ZipInfo(name)
                  e.external_attr = mode << 16
                  z.writestr(e, payload)
                  if extra:
                      z.writestr('extra.txt', b'x')
              return out.getvalue()
          blob = zipdata()
          digest = hashlib.sha256(blob).hexdigest()
          assert a.verify_zip(blob, 'sha256:' + digest, digest) == payload
          reject(a.verify_zip, blob, 'sha256:' + '0' * 64, digest)
          reject(a.verify_zip, blob, 'sha256:' + digest, '0' * 64)
          reject(a.verify_zip, blob + b'tampered', 'sha256:' + digest, digest)
          for bad in (zipdata('other.tar'), zipdata(mode=stat.S_IFLNK | 0o777),
                      zipdata(extra=True)):
              digest = hashlib.sha256(bad).hexdigest()
              reject(a.verify_zip, bad, 'sha256:' + digest, digest)
          print(f'Negative fixtures: {count} rejected; positive controls passed')
          PY
      - name: Run unchanged production artifact.py against the real same-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: python3 "$RUNNER_TEMP/pages-control/artifact.py"
      - name: Record successful non-deploy inspection
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pages-static'
          assert (root / 'index.html').is_file() and (root / '_headers').is_file()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Artifact diagnostic PASS; no deployment step exists.\n\n')
              for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'ARTIFACT_ID', 'ARTIFACT_DIGEST'):
                  out.write(f'{key}: {os.environ[key]}\n\n')
              out.write('API digest = upload digest = downloaded ZIP SHA256: verified by artifact.py.\n')
          PY