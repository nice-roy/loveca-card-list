        \    assert re.fullmatch(r'[0-9a-f]{40}', sha) and sha == os.environ['GITHUB_SHA']\n    root = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'pages-reconcile-control'\n    root.mkdir(mode=0o700)\n    class NoRedirect(urllib.request.HTTPRedirectHandler):\n\
        \        def redirect_request(self, *args, **kwargs): return None\n    opener = urllib.request.build_opener(NoRedirect)\n\
        \    files = {'pages-preview': ('guard.py', 'artifact.py'),\n             'pages-release': ('package.py', 'ledger.py',\
        \ 'reconcile.py', 'reconcile_http.py')}\n    for directory, names in files.items():\n        for name in names:\n\
        \            url = 'https://api.github.com/repos/nice-roy/loveca-card-list/contents/.github/' + directory + '/' +\
        \ name + '?ref=' + sha\n            req = urllib.request.Request(url, method='GET', headers={\n                'Authorization':\
        \ 'Bearer ' + os.environ['GH_TOKEN'],\n                'Accept': 'application/vnd.github+json'})\n            with\
        \ opener.open(req, timeout=30) as response:\n                assert response.status == 200\n                raw =\
        \ response.read(2 * 1024 * 1024 + 1)\n            assert len(raw) <= 2 * 1024 * 1024\n            value = json.loads(raw)\n\
        \            assert value['type'] == 'file' and value['encoding'] == 'base64'\n            (root / name).write_bytes(base64.b64decode(value['content']))\n\
        except BaseException:\n    raise SystemExit('Recovery control fetch STOP; no raw error') from None\nPYCONTROL\n"
    - name: approval
      id: stage
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 "$RUNNER_TEMP/pages-reconcile-control/reconcile.py" approval
    needs:
    - review
    environment:
      name: pages-production
      deployment: false
    outputs:
      binding: ${{ steps.stage.outputs.binding }}
  verify-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
