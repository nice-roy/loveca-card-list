name: Stage 2 Playwright validation

on:
  push:
    branches:
      - stage2-playwright-validation
  workflow_dispatch:

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run validate:utf8
      - run: npm run build
      - run: npx playwright test
      - run: npx playwright test
