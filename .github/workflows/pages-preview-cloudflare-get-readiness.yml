# Temporary W2.20 diagnostic: GET only; remove after one reviewed run.
name: Pages Preview Cloudflare GET Readiness

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-preview-cloudflare-get-readiness
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  readiness:
    if: >-
      github.repository == 'nice-roy/loveca-card-list' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'nice-roy' &&
      github.triggering_actor == 'nice-roy' &&
      vars.PAGES_PREVIEW_ENABLED == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: pages-preview
      deployment: false
    steps:
      - name: Checkout fixed trusted guard only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nice-roy/loveca-card-list
          ref: 0e2157d06dbc1b17c419f8677d17551c4e4badde
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/pages-preview/guard.py
          sparse-checkout-cone-mode: false
      - name: Verify trusted guard SHA256
        run: |
          test "$(git rev-parse HEAD)" = '0e2157d06dbc1b17c419f8677d17551c4e4badde'
          printf '%s\n' '0f2d805927b28bf5c3981741886c654e95a9cb05f5ab30e6b8208a5de0534590  .github/pages-preview/guard.py' | sha256sum --check --strict
      - name: Verify token and project using two GET requests only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ENABLED: ${{ vars.PAGES_PREVIEW_ENABLED }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import datetime, os, re, sys
          sys.path.insert(0, '.github/pages-preview')
          import guard

          stage = 'local prerequisites'
          try:
              guard.require(os.environ.get('PREVIEW_ENABLED') == 'false', 'Switch must remain false')
              account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
              guard.require(re.fullmatch(r'[0-9a-f]{32}', account) is not None, 'Invalid account ID')
              verify_url = 'https://api.cloudflare.com/client/v4/user/tokens/verify'
              project_url = (
                  'https://api.cloudflare.com/client/v4/accounts/' + account +
                  '/pages/projects/loveca-card-list'
              )
              requests = {verify_url: 0, project_url: 0}

              def get_only(event, args):
                  if event == 'urllib.Request':
                      url, data, headers, method = args
                      guard.require(url in requests and data is None and method == 'GET',
                                    'Request outside GET-only allowlist')
                      guard.require(requests[url] == 0, 'Duplicate GET request forbidden')
                      requests[url] += 1

              sys.addaudithook(get_only)
              stage = 'token verify GET'
              verified = guard.request_json(verify_url, os.environ.get('CLOUDFLARE_API_TOKEN'))
              guard.require(type(verified) is dict and verified.get('success') is True,
                            'Token verify did not report success')
              token_result = verified['result']
              guard.require(type(token_result) is dict and token_result.get('status') == 'active',
                            'Token is not active')
              now = datetime.datetime.now(datetime.timezone.utc)
              dates = {}
              for key in ('not_before', 'expires_on'):
                  stage = 'token validity ' + key
                  value = token_result.get(key)
                  if value is None:
                      dates[key] = 'not-set'
                      continue
                  guard.require(type(value) is str, 'Token date has invalid type')
                  parsed = datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
                  guard.require(parsed.tzinfo is not None, 'Token date has no timezone')
                  guard.require(parsed <= now if key == 'not_before' else parsed > now,
                                'Token date validity check failed')
                  dates[key] = parsed.astimezone(datetime.timezone.utc).isoformat()

              stage = 'Pages project GET'
              project = guard.cf()
              stage = 'production guard check_project'
              guard.check_project(project, 'pr-1')
              guard.require(all(count == 1 for count in requests.values()),
                            'Expected exactly two GET requests')
              cfg = project['source']['config']
              canonical = project['canonical_deployment']
              summary = [
                  'Cloudflare GET readiness PASS',
                  'token_verify_http=200',
                  'token_verify_success=true',
                  'token_status=active',
                  'token_not_before=' + dates['not_before'],
                  'token_expires_on=' + dates['expires_on'],
                  'project_get_http=200',
                  'project_get_success=true',
                  'project=' + project['name'],
                  'production_branch=' + project['production_branch'],
                  'source_type=' + project['source']['type'],
                  'source_owner=' + cfg['owner'],
                  'source_repo=' + cfg['repo_name'],
                  'source_production_branch=' + cfg['production_branch'],
                  'production_deployments_enabled=false',
                  'preview_deployment_setting=' + cfg['preview_deployment_setting'],
                  'canonical_environment=' + canonical['environment'],
                  'canonical_id=' + canonical['id'],
                  'canonical_source_sha=' + canonical['deployment_trigger']['metadata']['commit_hash'],
                  'guard_check_project=PASS',
                  'Cloudflare_GET_requests=2',
                  'No Cloudflare write request was issued.',
              ]
              stage = 'safe summary'
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('\n\n'.join(summary) + '\n')
              print('\n'.join(summary))
          except Exception as error:
              # Never print response objects, credentials, URLs, or arbitrary exception text.
              print('Cloudflare GET readiness STOP at ' + stage + ' (' + type(error).__name__ + ')',
                    file=sys.stderr)
              raise SystemExit(1)
          PY
