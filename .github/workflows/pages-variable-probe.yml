# W2.2 CANDIDATE ONLY: requires separate approval before placement on main.
# One read-only GitHub API probe. No checkout, external action, or publish command.
name: Pages variable probe (no deploy)

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe-disabled:
    if: >-
      github.repository == 'nice-roy/loveca-card-list' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'nice-roy/loveca-card-list/.github/workflows/pages-variable-probe.yml@refs/heads/main' &&
      github.actor == 'nice-roy' &&
      github.triggering_actor == 'nice-roy'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: pages-preview
      deployment: false
    steps:
      - name: Read live variable and require disabled state
        env:
          PAGES_VARIABLES_READ_TOKEN: ${{ secrets.PAGES_VARIABLES_READ_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYTHON_PROBE'
          import json, os, re, sys, urllib.error, urllib.request

          MAX_JSON_BYTES = 8 * 1024 * 1024

          def require(condition, reason):
              if not condition:
                  raise RuntimeError(reason)

          def request_json(url, token):
              require(isinstance(token, str) and bool(token.strip()), "Required read credential is missing")
              # Reject malformed headers before urllib can include their value in an error.
              require(re.fullmatch(r"[A-Za-z0-9._~+/-]+=*", token) is not None,
                      "Read credential has invalid format; STOP")
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
                  "User-Agent": "loveca-pages-preview-guard",
                  "Cache-Control": "no-cache",
              })
              if url.startswith("https://api.github.com/"):
                  req.add_header("X-GitHub-Api-Version", "2026-03-10")
              try:
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, req, fp, code, msg, headers, newurl):
                          return None
                  with urllib.request.build_opener(NoRedirect).open(req, timeout=30) as response:
                      require(response.status == 200, "Read API did not return HTTP 200")
                      require(response.headers.get_content_type() in
                              ("application/json", "application/vnd.github+json"),
                              "Read API did not return JSON content")
                      payload = response.read(MAX_JSON_BYTES + 1)
                      require(len(payload) <= MAX_JSON_BYTES, "Read API response exceeds limit")
                      return strict_json(payload)
              except urllib.error.HTTPError as error:
                  # Do not print response bodies, tokens or signed URLs.
                  raise RuntimeError(f"Read API rejected request: HTTP {error.code}") from None
              except (urllib.error.URLError, TimeoutError, ConnectionError, OSError):
                  raise RuntimeError("Read API connection failed; STOP") from None

          def strict_json(payload):
              def unique_object(pairs):
                  result = {}
                  for key, value in pairs:
                      require(key not in result, "Ambiguous JSON: duplicate member")
                      result[key] = value
                  return result

              def reject_constant(value):
                  raise RuntimeError("Non-standard JSON constant rejected")

              try:
                  return json.loads(payload.decode("utf-8"), object_pairs_hook=unique_object,
                                    parse_constant=reject_constant)
              except (UnicodeError, json.JSONDecodeError, RecursionError):
                  raise RuntimeError("Read API JSON decoding failed; STOP") from None

          try:
              token = os.environ.pop('PAGES_VARIABLES_READ_TOKEN', '')
              data = request_json(
                  'https://api.github.com/repos/nice-roy/loveca-card-list/actions/variables/PAGES_PREVIEW_ENABLED',
                  token)
              token = None
              require(type(data) is dict, 'Expected a single variable object')
              require(type(data.get('name')) is str and data['name'] == 'PAGES_PREVIEW_ENABLED',
                      'Unexpected variable')
              require(type(data.get('value')) is str and data['value'] == 'false',
                      'Expected exactly false')
          except Exception:
              # Never print HTTP bodies, exception details, headers, or token values.
              print('Probe STOP: variable read or validation failed. No deployment path exists.', file=sys.stderr)
              sys.exit(1)

          message = 'PASS: live PAGES_PREVIEW_ENABLED=false; Preview authorization denied. No deployment path exists.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(message + '\n')
          PYTHON_PROBE
