name: Pages Candidate read-only diagnostic

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type GET-ONLY; observe the failed candidate, never publish
        required: true
        type: string
      failed_candidate_run:
        description: Fixed failed Candidate run (37238592298)
        required: true
        type: string

permissions: {}

jobs:
  diagnose:
    if: >-
      github.repository == 'nice-roy/loveca-card-list' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'nice-roy' &&
      github.triggering_actor == 'nice-roy' &&
      github.run_attempt == 1 &&
      inputs.confirm == 'GET-ONLY' &&
      inputs.failed_candidate_run == '37238592298'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
    environment:
      name: pages-preview
      deployment: false
    steps:
      - name: Fetch only the diagnostic at this immutable workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          try:
              sha = os.environ['TRUSTED_SHA']
              assert re.fullmatch(r'[0-9a-f]{40}', sha)
              url = 'https://api.github.com/repos/nice-roy/loveca-card-list/contents/.github/pages-release/diagnostic.py?ref=' + sha
              req = urllib.request.Request(url, method='GET', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req, timeout=30) as response:
                  raw = response.read(1024 * 1024 + 1)
              assert len(raw) <= 1024 * 1024
              data = json.loads(raw)
              assert data['type'] == 'file' and data['encoding'] == 'base64'
              pathlib.Path(os.environ['RUNNER_TEMP'], 'diagnostic.py').write_bytes(base64.b64decode(data['content']))
          except Exception:
              raise SystemExit('DIAGNOSTIC_FETCH_FAILED') from None
          PY
      - name: Observe fixed candidate; GET-only, no release authorization
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
          PAGES_VARIABLES_READ_TOKEN: ${{ secrets.PAGES_VARIABLES_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 "$RUNNER_TEMP/diagnostic.py"
